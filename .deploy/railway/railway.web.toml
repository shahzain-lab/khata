# Copy into the Railway *web* service as railway.toml, OR set:
#   Settings → Config-as-code → Config File Path = .deploy/railway/railway.web.toml
#
# Dashboard → Service → Settings → Build:
#   Dockerfile path = .deploy/webapp/Dockerfile
# Networking: generate a public domain (Railway then injects PORT).

[build]
builder = "DOCKERFILE"
dockerfilePath = ".deploy/webapp/Dockerfile"

[build.args]
NODE_ENV = "production"
DEMO = "false"
NODE_OPTIONS = "--max-old-space-size=8192"

[deploy]
# Lightweight nginx probe — available immediately (before JS placeholder rewrite finishes)
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Do NOT set PORT yourself — Railway injects it; entrypoint binds nginx to $PORT (default 8080).
